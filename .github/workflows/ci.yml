name: ci

# The pre-merge gate required by loc-mesh/design ADR 0014. An sdk-* repo is
# impl-class: a PR must exist and this must be green before merge.
#
# ⚠️ The stake here is higher than for a service. A published package version
# cannot be unpublished after 72 hours, so this is the last gate before an
# interface becomes permanent on a public registry.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Packs exactly what `npm publish` would send. Catches a missing file or a
      # dist folder that did not build long before a customer does.
      - run: npm pack --dry-run
